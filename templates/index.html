<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #eee;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Prediction</h1>

        <form action="/predict" method="POST">

            <label>Study Hours</label>

            <input
                type="number"
                name="hours"
                step="0.1"
                min="0"
                required
            >

            <label>Attendance (%)</label>

            <input
                type="number"
                name="attendance"
                step="0.1"
                min="0"
                max="100"
                required
            >

            <button type="submit">
                Predict Result
            </button>

        </form>


        {% if result %}

        <div class="result">

            <h2>{{ result }}</h2>

            <p>
                Pass Probability:
                <strong>{{ probability }}%</strong>
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
